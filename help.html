<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Containers in Column</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .container1 {
      width: 100%;
      height: 100vh;
      background-color: #f9f4f4;
    }

    .container2 {
      width: 100%;
      height: 100vh;
      background-color: #d6e4f0;
      border: 2px solid black; /* added border */
    }
  </style>
</head>
<body>
  <div class="container1">
    <h1>Container 1</h1>
  </div>
  <div class="container2">
    <h1>Container 2</h1>
  </div>
</body>
</html>
